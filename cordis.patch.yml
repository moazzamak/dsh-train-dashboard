# The bundle patch: ONE row, the training dashboard.
#
# One row and not two. The boot audit fails on any entry left pending, so a
# second row that waited for the browser carrier would break the headless, SDK
# and ACP profiles, which have no webServer to wait for. The route is deferred
# inside the plugin with `ctx.inject(['webServer'], ...)` instead.
#
# EVERY VALUE BELOW IS A PLACEHOLDER. No plugin can guess the command that
# produces your snapshot, so `command` ships empty and the tab says a command
# has to be configured until you set one. Edit the row, or override it from a
# profile patch: a row's `config` is REPLACED wholesale and never deep-merged,
# so restate every key you care about rather than only the one you changed.
- insert:
    - id: train-dashboard
      name: dsh-train-dashboard
      config:
        # Absolute, and worth naming explicitly: a host process may start in the
        # profile directory, where a relative path resolves to nothing. It is
        # also the working directory of the command below and the base that
        # relative paths resolve against.
        workspace: /absolute/path/to/your/project
        # The argv of YOUR snapshot producer, one word per list item. There is no
        # shell here, so this is an argv array and not a shell string. `{snapshot}`
        # is replaced by `snapshotPath` below, `{workspace}` by the workspace, and
        # any other `{name}` by the config key of that name — which is how a
        # producer's own arguments (a logs directory, a run name) are passed.
        command:
          - python3
          - -m
          - your_project.snapshot_tool
          - --out
          - "{snapshot}"
        # Relative to `workspace`, or absolute. Your command writes this file;
        # the tab reads it. It is the only file this plugin causes to be written.
        snapshotPath: train-dashboard.snapshot.json
        # Optional label shown in the header when the snapshot does not name the
        # run itself. Leave it empty to use only what the snapshot carries.
        arm: ""
        # How often the snapshot may be regenerated, in seconds, while a tab is
        # open. A spawn happens only when the snapshot is older than this, and
        # only one spawn can be in flight. Raise it, do not lower it, while a
        # training job is running on the same machine.
        refreshSeconds: 30
        # Give up on a regeneration after this many seconds and report it,
        # rather than leaving a spinner forever.
        timeoutSeconds: 120
